service: solidcable
asset_path: /rails/public/assets
retain_containers: 1

servers:
  web:
    - <%= ENV["HOST"] %>

proxy:
  ssl: false
  host: solid-cable.dev
  forward_headers: true

registry:
  server: localhost:5555

env:
  clear:
    HISTFILE: /hist/.bash_history
    IRB_HISTFILE: /hist/.irb_history
    WEB_CONCURRENCY: auto
  secret:
    - RAILS_MASTER_KEY
    - MYSQL_ROOT_PASSWORD
    - HOST
    - POSTGRES_PASSWORD

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  bash: app exec -i --reuse "bash"
  rails: app exec -p "bin/rails"
  logs: app logs -f --roles=web

volumes:
  - "solidcable:/data"
  - "hist:/hist"

builder:
  arch: amd64
  args:
    RUBY_VERSION: <%= ENV["RBENV_VERSION"] %>

accessories:
  mysql:
    image: mysql:latest
    host: "<%= ENV['HOST'] %>"
    port: 3306
    env:
      clear:
        MYSQL_ROOT_HOST: '%'
      secret:
        - MYSQL_ROOT_PASSWORD
    files:
      - config/init.sql:/docker-entrypoint-initdb.d/setup.sql
    directories:
      - data:/var/lib/mysql
    cmd: mysqld --innodb-autoinc-lock-mode=0
  redis:
    image: redis:latest
    host: "<%= ENV['HOST'] %>"
    port: 6379
    cmd: "redis-server"
    volumes:
      - /var/lib/redis:/data
  postgres:
    image: postgres:latest
    host: "<%= ENV['HOST'] %>"
    port: 5432
    env:
      clear:
        POSTGRES_USER: "cablebench"
        POSTGRES_DB: "cablebench"
      secret:
        - POSTGRES_PASSWORD
    files:
      - config/init.sql:/docker-entrypoint-initdb.d/setup.sql
    directories:
      - data:/var/lib/postgresql
