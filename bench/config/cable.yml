development:
  # adapter: redis
  # url: redis://localhost:6379/1
  adapter: solid_cable
  message_retention: 15.minutes
  polling_interval: 0.1.seconds

test:
  adapter: test

production:
  # adapter: redis
  # url: <%= ENV.fetch("REDIS_URL") { "redis://solidcable-redis:6379/1" } %>
  # channel_prefix: cablebench_production

  # adapter: postgresql
  # database: cablebench
  # user: cablebench
  # password: <%= ENV["POSTGRES_PASSWORD"] %>
  # host: solidcable-postgres

  adapter: solid_cable
  polling_interval: 0.1.seconds
  message_retention: 30.seconds
  autotrim: true
  trim_batch_size: 100
  silence_polling: false
  writer_batch_size: 4
  writer_batch_delay: 0.001.seconds
