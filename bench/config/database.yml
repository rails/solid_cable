  adapter: postgresql
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000
  database: cablebench
  user: cablebench
  password: <%= ENV["POSTGRES_PASSWORD"] %>
  host: solidcable-postgres
  port: 5432
  sslmode: disable
